backend:
  name: github
  repo: rooprai7/rooprai-website
  branch: main
  base_url: https://auth.rooprai.uk
  auth_endpoint: /auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "Site Content"
    files:
      - name: "home"
        label: "Home & Site Settings"
        file: "content/home.json"
        format: json
        fields:
          - {label: "Browser Title", name: "title", widget: "string"}
          - {label: "SEO Description", name: "description", widget: "text"}
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Tagline", name: "tagline", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Blog Button", name: "blog_button", widget: "string"}
              - {label: "Contact Button", name: "contact_button", widget: "string"}
              - {label: "Background Image", name: "background_image", widget: "image"}
          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - {label: "Section Label", name: "label", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Paragraph 1", name: "paragraph1", widget: "text"}
              - {label: "Paragraph 2", name: "paragraph2", widget: "text"}
              - {label: "Signature", name: "signature", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
          - label: "Perfect Rail"
            name: "business"
            widget: "object"
            fields:
              - {label: "Section Label", name: "label", widget: "string"}
              - {label: "Business Name", name: "name", widget: "string"}
              - {label: "Tagline", name: "pill", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Image", name: "image", widget: "image"}
          - label: "Blog Section"
            name: "blog_section"
            widget: "object"
            fields:
              - {label: "Section Label", name: "label", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "View All Text", name: "view_all", widget: "string"}
          - label: "Gallery"
            name: "gallery"
            widget: "object"
            fields:
              - {label: "Section Label", name: "label", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Image 1", name: "image1", widget: "image"}
              - {label: "Image 2", name: "image2", widget: "image"}
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - {label: "Section Label", name: "label", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Location", name: "location", widget: "string"}
              - {label: "Email", name: "email", widget: "string"}
              - {label: "Website", name: "website", widget: "string"}
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - {label: "Copyright", name: "copyright", widget: "string"}
              - {label: "Brand Text", name: "brand", widget: "string"}

  - name: "blog"
    label: "Blog Posts"
    files:
      - name: "posts"
        label: "Posts"
        file: "content/blog.json"
        format: json
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Category", name: "category", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Link", name: "link", widget: "string", required: false}
              - {label: "Link Text", name: "link_text", widget: "string"}
